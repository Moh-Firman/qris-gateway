<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="arr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="260" rx="16" fill="#0d1424"/>

  <!-- boxes -->
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="70" width="200" height="120" rx="14" fill="url(#card)" stroke="#2b3b63" stroke-width="1.5"/>
    <text x="120" y="115" fill="#ffffff" font-weight="700">Pembeli</text>
    <text x="120" y="140" fill="#8b9cc7" font-size="13">Scan QRIS via</text>
    <text x="120" y="160" fill="#8b9cc7" font-size="13">DANA / e-wallet</text>

    <rect x="260" y="70" width="200" height="120" rx="14" fill="url(#card)" stroke="#2b3b63" stroke-width="1.5"/>
    <text x="360" y="115" fill="#ffffff" font-weight="700">DANA Notify</text>
    <text x="360" y="140" fill="#8b9cc7" font-size="13">Aplikasi Android</text>
    <text x="360" y="160" fill="#8b9cc7" font-size="13">baca notifikasi bayar</text>

    <rect x="500" y="70" width="200" height="120" rx="14" fill="url(#card)" stroke="#22c55e" stroke-width="2"/>
    <text x="600" y="115" fill="#ffffff" font-weight="700">QRIS Gateway</text>
    <text x="600" y="140" fill="#8b9cc7" font-size="13">cocokkan nominal unik</text>
    <text x="600" y="160" fill="#8b9cc7" font-size="13">tandai lunas otomatis</text>

    <rect x="740" y="70" width="200" height="120" rx="14" fill="url(#card)" stroke="#2b3b63" stroke-width="1.5"/>
    <text x="840" y="115" fill="#ffffff" font-weight="700">Webhook</text>
    <text x="840" y="140" fill="#8b9cc7" font-size="13">kirim ke server</text>
    <text x="840" y="160" fill="#8b9cc7" font-size="13">toko / bot kamu</text>

    <rect x="980" y="70" width="200" height="120" rx="14" fill="url(#card)" stroke="#2b3b63" stroke-width="1.5"/>
    <text x="1080" y="115" fill="#ffffff" font-weight="700">Dashboard</text>
    <text x="1080" y="140" fill="#8b9cc7" font-size="13">pantau transaksi</text>
    <text x="1080" y="160" fill="#8b9cc7" font-size="13">&amp; mutasi real-time</text>
  </g>

  <!-- arrows -->
  <g stroke="url(#arr)" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="222" y1="130" x2="256" y2="130"/>
    <line x1="462" y1="130" x2="496" y2="130"/>
    <line x1="702" y1="130" x2="736" y2="130"/>
    <line x1="942" y1="130" x2="976" y2="130"/>
  </g>

  <text x="600" y="235" fill="#5b6b94" font-size="13" text-anchor="middle">Tanpa API resmi bank — deteksi via notifikasi DANA di HP Android kamu</text>
</svg>
